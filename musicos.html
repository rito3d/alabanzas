<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10131a">
<title>Músicos — Alabanzas MMM</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono.svg">
<link rel="apple-touch-icon" href="icono.svg">
<link rel="stylesheet" href="estilo.css">
<style>
  main { max-width: 900px; margin: 0 auto; padding: 12px 14px 80px; }
  .cab h2 { margin: 4px 0 2px; font-size: 24px; }
  .herram { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 10px 0 12px; }
  .tonoactual { min-width: 60px; text-align: center; font-weight: 800; color: var(--acento); font-size: 18px; }
  #letra { font-size: 18px; }
  .siguiente { margin-top: 14px; font-size: 15px; }
  .vacio { text-align: center; color: var(--tenue); padding: 60px 10px; font-size: 18px; }
  select { width: auto; max-width: 55vw; padding: 8px 10px; }
</style>
</head>
<body>
<header class="barra">
  <h1>🎸 Músicos</h1>
  <select id="elegir"><option value="">🔴 Seguir en vivo</option></select>
  <span class="punto" id="conexion"></span>
</header>
<main>
  <div class="cab">
    <h2 id="titulo">Esperando alabanza…</h2>
    <div class="tenue" id="sub"></div>
  </div>
  <div class="herram">
    <span class="tenue">Tono:</span>
    <button class="chico" id="bajar">−½</button>
    <span class="tonoactual" id="tono">—</span><span class="tenue" id="tonoOrig" style="font-size:12px"></span>
    <button class="chico" id="subir">+½</button>
    <button class="chico" id="notacion">Do/C</button>
    <span style="flex:1"></span>
    <button class="chico" id="menos">A−</button>
    <button class="chico" id="mas">A+</button>
  </div>
  <div class="tarjeta vista-acordes" id="letra"><div class="vacio">Cuando el control ponga una alabanza en la pantalla, aparecerá aquí con sus acordes.</div></div>
  <div class="tenue" id="notas" style="margin-top:10px"></div>
  <div class="tarjeta siguiente" id="siguiente"></div>
</main>
<script src="config.js"></script>
<script src="comun.js"></script>
<script type="module">
import './nube.js';

const $ = id => document.getElementById(id);
let canciones = [], estado = {}, prog = { cultos: [], turnos: [] }, manual = '', manualCulto = '', manualTurno = '', pasos = {}, latino, tam = 18, ultimaSec = -1, ultimaId = null;
try { tam = +localStorage.getItem('tamMusicos') || 18; } catch {}

const cancionDe = id => canciones.find(c => c.id === id);
// por adelantado: cada próximo culto con sus alabanzas en orden (para ensayar)
function pintarSelector() {
  const valor = manual ? manualCulto + '|' + manual + (manualTurno ? '|' + manualTurno : '') : '';
  const op = (cu, t, i) => { const c = cancionDe(t.cancionId); const v = cu.id + '|' + c.id + '|' + t.id;
    return `<option value="${v}" ${v === valor ? 'selected' : ''}>${i + 1}. ${t.tipo && TIPOS[t.tipo] ? TIPOS[t.tipo].icono + ' ' : ''}${escaparHTML(c.titulo)}${t.cantante ? ' — ' + escaparHTML(t.cantante) : ''}${tonoTurno(t, c) ? ' (' + escaparHTML(tonoTurno(t, c)) + ')' : ''}</option>`; };
  const grupos = cultosOrdenados(prog).proximos.map(cu => {
    const ts = turnosDe(prog, cu.id).filter(t => cancionDe(t.cancionId));
    return ts.length ? `<optgroup label="📅 ${escaparHTML(fechaBonita(cu.fecha, true))} · ${escaparHTML(cu.nombre)}">${ts.map((t, i) => op(cu, t, i)).join('')}</optgroup>` : '';
  }).join('');
  const todas = canciones.slice().sort((a, b) => a.titulo.localeCompare(b.titulo, 'es'))
    .map(c => `<option value="|${c.id}" ${('|' + c.id) === valor ? 'selected' : ''}>${escaparHTML(c.titulo)}</option>`).join('');
  $('elegir').innerHTML = `<option value="">🔴 Seguir en vivo</option>${grupos}<optgroup label="🎵 Todas">${todas}</optgroup>`;
}
$('elegir').onchange = () => { const [cu, id, tid] = ($('elegir').value || '|').split('|'); manual = id || ''; manualCulto = cu || ''; manualTurno = tid || ''; ultimaSec = -1; pintar(); };
// en qué culto estamos: el elegido a mano, o el de hoy/próximo que tenga esta alabanza
function cultoActual(cid) {
  if (manual && manualCulto) return manualCulto;
  const h = cultoDeHoy(prog);
  if (h && turnosDe(prog, h.id).some(t => t.cancionId === cid)) return h.id;
  const cu = cultosOrdenados(prog).proximos.find(x => turnosDe(prog, x.id).some(t => t.cancionId === cid));
  return cu ? cu.id : null;
}

function pintar() {
  const id = manual || estado.cancionId;
  const c = canciones.find(x => x.id === id);
  if (!c) {
    $('titulo').textContent = 'Esperando alabanza…'; $('sub').textContent = ''; $('tono').textContent = '—';
    $('letra').innerHTML = '<div class="vacio">Cuando el control ponga una alabanza en la pantalla, aparecerá aquí con sus acordes.</div>';
    $('notas').textContent = ''; pintarSiguiente(null); return;
  }
  const cuId0 = cultoActual(c.id);
  const turno0 = (manual && manualTurno && prog.turnos.find(t => t.id === manualTurno)) ||
    (!manual && estado.cancionId === c.id && cuId0 && turnosDe(prog, cuId0).find(t => t.cancionId === c.id && mismoNombre(t.cantante, estado.cantante))) ||
    (cuId0 && turnosDe(prog, cuId0).find(t => t.cancionId === c.id));
  // tono de este hermano: los acordes se cambian solos (en vivo manda el tono que puso el control)
  const objetivo = (!manual && estado.cancionId === c.id && estado.tono) || (turno0 && turno0.tono) || c.tono || '';
  claveActual = c.id + '|' + objetivo;
  const auto = semitonos(c.tono, objetivo) || 0;
  const p = claveActual in pasos ? pasos[claveActual] : auto;
  $('titulo').textContent = c.titulo;
  const cuId = cuId0, turno = turno0;
  const quien = (!manual && estado.cancionId === c.id && estado.cantante) || (turno && turno.cantante) || c.cantante;
  const cu = cuId && prog.cultos.find(x => x.id === cuId);
  $('sub').textContent = [quien && '🎤 ' + quien, c.autor, cu && '📅 ' + fechaBonita(cu.fecha, true)].filter(Boolean).join(' · ');
  $('tono').textContent = c.tono ? transponerAcorde(c.tono, p, latino) : (p > 0 ? '+' : '') + p;
  $('tonoOrig').textContent = c.tono && p ? `original ${transponerAcorde(c.tono, 0, latino)}` : '';
  const secs = analizarLetra(c.letra);
  // qué sección corresponde a la pantalla en vivo
  const conLetra = secs.map((s, i) => s.lineas.some(l => l.letra.trim()) ? i : -1).filter(i => i >= 0);
  const enVivo = !manual || manual === estado.cancionId;
  const secActual = enVivo && c.id === estado.cancionId ? conLetra[estado.seccion] : -1;
  $('letra').innerHTML = secs.map((s, i) => `<div class="sec ${i === secActual ? 'actual' : ''}" id="sec${i}">${htmlSeccionAcordes(s, p, latino)}</div>`).join('') || '<span class="tenue">Sin letra</span>';
  $('letra').style.fontSize = tam + 'px';
  $('notas').textContent = c.notas ? '📝 ' + c.notas : '';
  if (secActual >= 0 && (secActual !== ultimaSec || c.id !== ultimaId)) {
    const el = $('sec' + secActual);
    el && el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  ultimaSec = secActual; ultimaId = c.id; turnoVisto = turno0 || null;
  pintarSiguiente(c);
}
function pintarSiguiente(c) {
  const cuId = c && cultoActual(c.id);
  const ts = cuId ? turnosDe(prog, cuId).filter(t => cancionDe(t.cancionId)) : [];
  const i = c ? (turnoVisto ? ts.findIndex(t => t.id === turnoVisto.id) : ts.findIndex(t => t.cancionId === c.id)) : -1;
  const tSig = i >= 0 && ts[i + 1];
  const sig = tSig && { ...cancionDe(tSig.cancionId), cantante: tSig.cantante || cancionDe(tSig.cancionId).cantante };
  $('siguiente').classList.toggle('oculto', !sig);
  if (sig) sig.tono = tonoTurno(tSig, sig);
  if (sig) $('siguiente').innerHTML = `<span class="tenue">Después:</span> <b>${escaparHTML(sig.titulo)}</b> ${sig.tono ? '· <span style="color:var(--acento)">' + escaparHTML(sig.tono) + '</span>' : ''} ${sig.cantante ? '· 🎤 ' + escaparHTML(sig.cantante) : ''}`;
}
let claveActual = '', turnoVisto = null;
const pasosActuales = () => { const [id, obj] = claveActual.split('|'); const c = cancionDe(id); return claveActual in pasos ? pasos[claveActual] : (c ? semitonos(c.tono, obj) || 0 : 0); };
$('subir').onclick = () => { if (claveActual) { pasos[claveActual] = pasosActuales() + 1; pintar(); } };
$('bajar').onclick = () => { if (claveActual) { pasos[claveActual] = pasosActuales() - 1; pintar(); } };
$('notacion').onclick = () => { latino = latino === undefined ? true : latino ? false : undefined; $('notacion').textContent = latino === undefined ? 'Do/C' : latino ? 'Do' : 'C'; pintar(); };
const guardarTam = () => { try { localStorage.setItem('tamMusicos', tam); } catch {} };
$('mas').onclick = () => { tam = Math.min(34, tam + 2); guardarTam(); pintar(); };
$('menos').onclick = () => { tam = Math.max(11, tam - 2); guardarTam(); pintar(); };

escucharEventos({
  conexion: ok => $('conexion').classList.toggle('on', ok),
  estado: e => { estado = e; pintarSelector(); pintar(); },
  canciones: async () => { canciones = await API.canciones(); pintarSelector(); pintar(); },
  programa: async () => { prog = await API.programa(); pintarSelector(); pintar(); }
});
Promise.all([API.canciones(), API.programa()]).then(([c, p]) => { canciones = c; prog = p; pintarSelector(); pintar(); });
</script>
</body>
</html>
